name: Fast-Track risk report

on:
  pull_request:
    branches: [main, experimental]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: fast-track-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    name: Fast-Track risk report (advisory)
    if: github.event.action != 'edited' || github.event.changes.base.ref.from != null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the risk selector
        run: python3 -B -m unittest discover -s tests/fast_track -v
      - name: Print report for PR revisions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET: ${{ github.base_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '### Advisory risk report\n\n~~~json\n' >> "$GITHUB_STEP_SUMMARY"
          python3 -B scripts/risk_report.py --base "$BASE_SHA" --head "$HEAD_SHA" \
            --target "$TARGET" --report-url "$RUN_URL" | tee -a "$GITHUB_STEP_SUMMARY"
          printf '~~~\n' >> "$GITHUB_STEP_SUMMARY"
