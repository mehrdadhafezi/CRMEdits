name: CRM CI
on:
  pull_request:
    branches: [main, experimental]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, experimental]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # An unrelated edit must not cancel validation already running on the revision.
  group: crm-ci-${{ github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base.ref.from == null && github.run_id || 'revision' }}
  cancel-in-progress: true

jobs:
  stable-pr-boundary:
    name: Stable PR branch boundary
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check source branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          case "$HEAD_BRANCH" in
            experimental|experiment/*)
              echo 'Use a fresh branch from main and port only the approved changes.'
              exit 1
              ;;
          esac
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check experimental history
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/experimental:refs/branch-boundary/experimental \
            'refs/heads/experiment/*:refs/branch-boundary/experiment/*'
          refs=$(git for-each-ref --format='%(refname)' refs/branch-boundary)
          while IFS= read -r ref; do
            common=$(git merge-base --all "$HEAD_SHA" "$ref")
            while IFS= read -r sha; do
              if ! git merge-base --is-ancestor "$sha" "$BASE_SHA"; then
                echo 'This PR shares commits outside its main base with an experimental branch.'
                exit 1
              fi
            done <<< "$common"
          done <<< "$refs"

  syntax:
    name: PHP and JavaScript syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install CLI parser
        run: |
          sudo apt-get update
          sudo apt-get install --yes php8.3-cli
      - run: python3 scripts/check.py syntax

  documentation:
    name: Documentation and repository hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/check.py docs
      - run: python3 scripts/check.py hygiene

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks 8.24.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_checksums.txt -o "$RUNNER_TEMP/gitleaks-checksums.txt"
          expected=$(awk '$2 == "gitleaks_8.24.3_linux_x64.tar.gz" {print $1}' "$RUNNER_TEMP/gitleaks-checksums.txt")
          test -n "$expected"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan worktree and complete Git history
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --log-opts="--all" --redact --no-banner

  plan:
    name: Fast-Track test plan
    if: github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref.from != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      finance: ${{ steps.plan.outputs.finance }}
      campaign_ui: ${{ steps.plan.outputs.campaign_ui }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: python3 -B scripts/fast_track_ci.py plan
      - name: Validate orchestration and the selector
        if: fromJSON(steps.plan.outputs.plan).risk != 'LOW'
        run: python3 -B -m unittest discover -s tests/fast_track -v

  finance:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result != 'skipped' && (needs.plan.result != 'success' || needs.plan.outputs.finance != 'false') }}
    uses: ./.github/workflows/finance-integration.yml

  campaign-ui:
    name: Campaign spacing browser regression
    needs: plan
    if: needs.plan.outputs.campaign_ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned public browser tooling
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/campaign-browser" --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/campaign-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check synthetic campaign layout in Chromium
        run: node tests/fast_track/campaign-smoke.cjs "$RUNNER_TEMP/campaign-browser/node_modules/playwright"

  summary:
    name: Fast-Track readiness summary
    needs: [plan, syntax, documentation, secrets, stable-pr-boundary, finance, campaign-ui]
    if: ${{ always() && github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref.from != null) }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Summarize test results from this revision
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.plan.outputs.plan }}
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -B scripts/fast_track_ci.py summary
