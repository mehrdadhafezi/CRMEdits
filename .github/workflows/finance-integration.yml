name: Finance approval integration
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wordpress-mysql:
    name: WP ${{ matrix.wordpress }} MySQL / upgrade from ${{ matrix.baseline }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - baseline: '2.0.235'
            wordpress: '7.1.4'
          - baseline: '2.0.236'
            wordpress: '7.1.4'
          - baseline: '2.0.237-installed'
            wordpress: '7.1.4'
          - baseline: '2.0.237-installed'
            wordpress: '6.9.11'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact PR merge revision
        if: github.event_name == 'pull_request'
        run: python3 -B scripts/fast_track_ci.py verify-checkout
      - name: Isolated WordPress, MySQL, AJAX and Chromium regression
        env:
          SN_TEST_BASELINE: ${{ matrix.baseline }}
          SN_TEST_WORDPRESS: ${{ matrix.wordpress }}
        run: bash scripts/test-finance-integration.sh
      - name: Verify native Finance evidence
        env:
          SN_TEST_BASELINE: ${{ matrix.baseline }}
          SN_TEST_WORDPRESS: ${{ matrix.wordpress }}
        run: python3 -B scripts/fast_track_ci.py verify-finance-output
      - name: Upload synthetic evidence and exact installation candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finance-integration-${{ matrix.baseline }}-wp${{ matrix.wordpress }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/finance/**
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
